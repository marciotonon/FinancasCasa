{% extends "base.html" %}
{% block title %}Nova Conta - FinançasCasa{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-plus-circle"></i> Nova Conta a Pagar</h1>
    <a href="{{ url_for('contas') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
</div>

<div class="panel panel-form">
    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label for="entrada">Entrada / Valor já Pago (R$)</label>
                <input type="number" id="entrada" name="entrada" class="form-control" step="0.01" min="0" value="0" placeholder="0,00">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group form-group-grow">
                <label for="descricao">Descrição *</label>
                <input type="text" id="descricao" name="descricao" class="form-control" placeholder="Ex: Luz, Água, Internet..." required>
            </div>
            <div class="form-group">
                <label for="valor">Valor (R$) *</label>
                <input type="number" id="valor" name="valor" class="form-control" step="0.01" min="0.01" placeholder="0,00" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="vencimento">Vencimento *</label>
                <input type="date" id="vencimento" name="vencimento" class="form-control" value="{{ hoje }}" required>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria *</label>
                <select id="categoria" name="categoria" class="form-control" required>
                    {% for cat in categorias %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="num_installments">Número de Parcelas</label>
            <input type="number" id="num_installments" name="num_installments" class="form-control" value="1" min="1" required>
        </div>
        <div class="form-group">
            <label for="observacao">Observação</label>
            <textarea id="observacao" name="observacao" class="form-control" rows="2" placeholder="Opcional..."></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-warning btn-lg"><i class="fas fa-save"></i> Salvar Conta</button>
            <a href="{{ url_for('contas') }}" class="btn btn-secondary btn-lg">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
